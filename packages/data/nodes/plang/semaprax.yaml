name: SEMAPRAX
shortDesc: Experimental agent-native systems language with stable semantic identity and native/Wasm targets.
description: SEMAPRAX is an Apache-2.0 pre-alpha systems programming language designed so coding agents can operate on a versioned semantic graph instead of reconstructing meaning from text. Its Rust compiler provides stable declaration identities, bounded semantic impact and review, evidence-gated patches, ownership checking, and deterministic native C11 and WebAssembly Core output.
